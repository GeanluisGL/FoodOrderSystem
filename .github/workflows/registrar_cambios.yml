name: Registrar Cambios en Excel

on:
  push:
    branches:
      - '**' # Se activa en absolutamente cualquier rama
  release:
    types: [published] # Se activa cuando se crea un release oficial

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crucial para que GitHub Actions pueda guardar el Excel modificado

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Configurar el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Instalar la librería para manejar Excel
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    # 4. Ejecutar el script enviando las variables de GitHub
    - name: Ejecutar script de registro
      run: |
        python update_excel.py \
          "${{ github.actor }}" \
          "${{ github.ref }}" \
          "${{ github.event.release.tag_name }}" \
          "${{ github.event.head_commit.message }}" \
          "${{ github.sha }}"

    # 5. Guardar el archivo Excel modificado de vuelta en GitHub
    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add historial_cambios.xlsx
        # Solo hacer commit si el archivo realmente cambió para evitar bucles de error
        git diff --quiet && git diff --staged --quiet || (git commit -m "Changelog automatizado: Registro de cambio por ${{ github.actor }}" && git push)
