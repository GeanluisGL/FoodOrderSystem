name: Registrar Cambios en Excel
env:
    TZ: America/Santo_Domingo
    
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'historial_cambios.xlsx'   # 🔑 evita el bucle infinito
  release:
    types: [published]

# 🔑 evita ejecuciones simultáneas que corrompan el Excel
concurrency:
  group: historial-cambios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      # 4. Ejecutar script
      - name: Ejecutar script de registro
        run: |
            python scripts/registrar_cambio.py \
            "${{ github.actor }}" \
            "${{ github.ref }}" \
            "${{ github.event.release.tag_name || '' }}" \
            "${{ github.event.head_commit.message || github.event.release.name || 'Release publicado' }}" \
            "${{ github.sha }}"

      # 5. Commit y push (solo si el Excel cambió)
      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Si no hay cambios, salir sin hacer nada
          if git diff --quiet -- historial_cambios.xlsx; then
            echo "Sin cambios en el Excel. Nada que hacer."
            exit 0
          fi

          git add historial_cambios.xlsx
          git commit -m "chore: changelog automatizado [${{ github.actor }}]"

          # Traer cambios remotos por si alguien más hizo push mientras tanto
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
